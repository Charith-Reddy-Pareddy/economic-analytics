services:
  - type: web
    name: economic-pulse-analytics
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/load_data.py
    startCommand: gunicorn app:server --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
